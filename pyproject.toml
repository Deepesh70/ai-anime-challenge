[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aianime-restoration"
version = "0.1.0"
description = "Anime video degradation inversion and restoration pipeline for WACV 2027 Re-Anime600 Challenge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AIAnime Team" }
]
keywords = ["anime-restoration", "super-resolution", "video-processing", "guided-filter", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.10.0",
    "huggingface_hub>=0.20.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0"
]

[project.urls]
"Homepage" = "https://github.com/placeholder/AIAnime"
